<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Caption App</title>
  <style>
    body { font-family: Arial; background:#0f0f0f; color:white; padding:20px; }
    .box { max-width:500px; margin:auto; }
    input, textarea, button {
      width:100%; margin-top:10px; padding:12px;
      border-radius:8px; border:none;
    }
    button { background:#22c55e; color:white; font-weight:bold; }
    #status { margin-top:10px; }
  </style>
</head>

<body>
<div class="box">
  <h2>Video Caption Tool</h2>

  <input type="file" id="video" accept="video/*" />
  <textarea id="captions" placeholder="Paste captions here..."></textarea>

  <button onclick="send()">Process Video</button>

  <p id="status"></p>

  <a id="download" style="display:none;">
    <button>Download Video</button>
  </a>
</div>

<script>
async function send() {
  const video = document.getElementById("video").files[0];
  const captions = document.getElementById("captions").value;
  const status = document.getElementById("status");

  if (!video || !captions) {
    alert("Add video + captions");
    return;
  }

  status.innerText = "Processing...";

  const form = new FormData();
  form.append("video", video);
  form.append("captions", captions);

  try {
    const res = await fetch("/export", {
      method: "POST",
      body: form
    });

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    const dl = document.getElementById("download");
    dl.href = url;
    dl.download = "captioned.mp4";
    dl.style.display = "block";

    status.innerText = "Done!";
  } catch (e) {
    status.innerText = "Error processing video";
  }
}
</script>

</body>
</html>
