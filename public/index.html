<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Caption Tool</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    input, textarea, button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }

    textarea {
      height: 120px;
    }

    button {
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
    }

    a button {
      background: #3b82f6;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Video Caption Editor</h2>

  <input type="file" id="videoInput" accept="video/*" />

  <textarea id="captionInput" placeholder="Paste captions here..."></textarea>

  <button onclick="uploadVideo()">Process Video</button>

  <p id="status"></p>

  <a id="downloadLink" style="display:none;">
    <button>Download Video</button>
  </a>

</div>

<script>
async function uploadVideo() {
  const video = document.getElementById("videoInput").files[0];
  const captions = document.getElementById("captionInput").value;
  const status = document.getElementById("status");

  if (!video || !captions) {
    alert("Please select video and captions");
    return;
  }

  status.innerText = "Processing...";

  const formData = new FormData();
  formData.append("video", video);
  formData.append("captions", captions);

  try {
    const response = await fetch("https://video-caption-app-60ko.onrender.com/export", {
      method: "POST",
      body: formData
    });

    if (!response.ok) throw new Error("Server error");

    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);

    const downloadLink = document.getElementById("downloadLink");
    downloadLink.href = url;
    downloadLink.download = "captioned-video.mp4";
    downloadLink.style.display = "block";

    status.innerText = "Done!";
  } catch (err) {
    console.log(err);
    status.innerText = "Failed to process video";
  }
}
</script>

<!-- SERVICE WORKER REGISTRATION (IMPORTANT) -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js")
      .then(() => console.log("Service Worker registered"))
      .catch(err => console.log("SW error", err));
  }
</script>

</body>
</html>
