<!DOCTYPE html>
<html>
<head>
  <title>Video Caption Tool</title>
  <link rel="manifest" href="/manifest.json">
</head>

<body>
  <h2>Video Caption Tool</h2>

  <input type="file" id="video" />
  <textarea id="captions" placeholder="Enter captions"></textarea>

  <button onclick="uploadVideo()">Process Video</button>

  <p id="status"></p>

<script>
async function uploadVideo() {
  const video = document.getElementById("video").files[0];
  const captions = document.getElementById("captions").value;
  const status = document.getElementById("status");

  if (!video) {
    alert("Select video first");
    return;
  }

  const formData = new FormData();
  formData.append("video", video);
  formData.append("captions", captions);

  status.innerText = "Uploading...";

  try {
    status.innerText = "Processing...";

    const res = await fetch("/export", {
      method: "POST",
      body: formData
    });

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "video.mp4";
    a.click();

    status.innerText = "Done ✔";

  } catch (e) {
    status.innerText = "Error processing video";
  }
}
</script>

</body>
</html>
