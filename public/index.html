<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Video Caption Tool</title>

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#22c55e" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    input, button {
      margin: 10px;
      padding: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #22c55e;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Video Caption Tool</h1>

  <input type="file" id="video" />
  <br />

  <textarea id="captions" placeholder="Enter captions..." rows="5" cols="30"></textarea>
  <br />

  <button onclick="uploadVideo()">Process Video</button>

  <p id="status"></p>

  <script>
    async function uploadVideo() {
      const video = document.getElementById("video").files[0];
      const captions = document.getElementById("captions").value;

      if (!video) {
        alert("Select a video first");
        return;
      }

      const formData = new FormData();
      formData.append("video", video);
      formData.append("captions", captions);

      document.getElementById("status").innerText = "Processing...";

      const res = await fetch("/export", {
        method: "POST",
        body: formData
      });

      if (res.ok) {
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "output.mp4";
        a.click();

        document.getElementById("status").innerText = "Done!";
      } else {
        document.getElementById("status").innerText = "Failed!";
      }
    }
  </script>

  <!-- SERVICE WORKER REGISTRATION -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js")
        .then(() => console.log("Service Worker registered"))
        .catch(err => console.log("SW error", err));
    }
  </script>

</body>
</html>
